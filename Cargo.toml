[package]
name = "m2s2-rust-vulkan"
version = "0.1.0"
edition = "2021"

[dependencies]
# Vulkan bindings
ash = "0.38"
ash-window = "0.13"
# Surface handle types for the renderer's public API (window ownership lives with the caller)
raw-window-handle = "0.6"
# Math library (published to crates.io; override locally with .cargo/config.toml for cross-repo dev)
# `bytemuck` feature (added in 0.2.2) makes its vectors Pod, so Vertex (position/color: Vec3) uploads to GPU buffers.
m2s2-math = { version = "0.2.2", features = ["bytemuck"] }
# Utility for safe transmutation
bytemuck = { version = "1.14", features = ["derive"] }
# Logging
log = "0.4"
env_logger = "0.10"
# Error handling
anyhow = "1.0"
# GPU memory allocator (vulkan backend only — skip the default d3d12/metal backends)
gpu-allocator = { version = "0.28", default-features = false, features = ["vulkan", "std"] }

[dev-dependencies]
# For examples and tests
pollster = "0.3"
winit = "0.29"
# PNG encoding/decoding for golden-image tests
png = "0.17"

[[example]]
name = "triangle"
path = "examples/triangle.rs"

[[example]]
name = "window"
path = "examples/window.rs"
